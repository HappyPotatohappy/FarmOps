<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="735" viewBox="0 0 1080 735" role="img" aria-label="공통 앙상블의 입력과 두 모델의 예측 결합"><title>공통 앙상블의 입력과 두 모델의 예측 결합</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#597b6b"/></marker></defs><rect width="1080" height="735" fill="white"/><g font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif"><rect x="325" y="20" width="430" height="103" rx="12" fill="#f5f8f2" stroke="#bfcfc4"/><text x="540.0" y="58" font-size="23" font-weight="400" fill="#29413f" text-anchor="middle">최근 168시간 관측</text><text x="540.0" y="89" font-size="23" font-weight="400" fill="#29413f" text-anchor="middle">벌통 무게 kg  ·  외부 온도 °C</text><path d="M440 123 L440 146 L275 146 L275 175" fill="none" stroke="#597b6b" stroke-width="3" marker-end="url(#a)"/><path d="M640 123 L640 146 L805 146 L805 175" fill="none" stroke="#597b6b" stroke-width="3" marker-end="url(#a)"/><rect x="35" y="178" width="480" height="285" rx="12" fill="#edf5ed" stroke="#bfcfc4"/><text x="275.0" y="216" font-size="21" font-weight="400" fill="#29413f" text-anchor="middle">TensorFlow LSTM</text><text x="275.0" y="247" font-size="21" font-weight="400" fill="#29413f" text-anchor="middle">무게 변화량과 온도 정규화</text><text x="275.0" y="278" font-size="21" font-weight="400" fill="#29413f" text-anchor="middle">LSTM 16 → Dense 32 → Dense 168</text><text x="275.0" y="309" font-size="21" font-weight="400" fill="#29413f" text-anchor="middle">168개 시간별 변화량을 직접 출력</text><text x="275.0" y="340" font-size="21" font-weight="400" fill="#29413f" text-anchor="middle">마지막 관측 무게를 더해 kg로 복원</text><rect x="565" y="178" width="480" height="285" rx="12" fill="#f8f3e5" stroke="#bfcfc4"/><text x="805.0" y="216" font-size="21" font-weight="400" fill="#29413f" text-anchor="middle">TiRex 2 기반 모델</text><text x="805.0" y="247" font-size="21" font-weight="400" fill="#29413f" text-anchor="middle">무게 시계열 + 과거 외부 온도 입력</text><text x="805.0" y="278" font-size="21" font-weight="400" fill="#29413f" text-anchor="middle">사전학습 체크포인트로 추론</text><text x="805.0" y="309" font-size="21" font-weight="400" fill="#29413f" text-anchor="middle">9개 분위수 중 중앙값 선택</text><text x="805.0" y="340" font-size="21" font-weight="400" fill="#29413f" text-anchor="middle">168개 시간별 무게 kg 출력</text><text x="275" y="427" font-size="19" font-weight="600" fill="#29413f" text-anchor="middle">재학습 시 LSTM 가중치 갱신</text><text x="805" y="427" font-size="19" font-weight="600" fill="#29413f" text-anchor="middle">재학습 시 체크포인트 유지</text><path d="M275 463 L275 496 L440 496 L440 529" fill="none" stroke="#597b6b" stroke-width="3" marker-end="url(#a)"/><path d="M805 463 L805 496 L640 496 L640 529" fill="none" stroke="#597b6b" stroke-width="3" marker-end="url(#a)"/><rect x="195" y="532" width="690" height="141" rx="12" fill="#eaf0e7" stroke="#bfcfc4"/><text x="540.0" y="570" font-size="22" font-weight="400" fill="#29413f" text-anchor="middle">공통 앙상블</text><text x="540.0" y="601" font-size="22" font-weight="400" fill="#29413f" text-anchor="middle">예측 무게 = w × LSTM + (1 − w) × TiRex 2</text><text x="540.0" y="632" font-size="22" font-weight="400" fill="#29413f" text-anchor="middle">재학습 시 별도 구간으로 결합 비중 w를 다시 선택</text><text x="540" y="710" font-size="20" font-weight="400" fill="#29413f" text-anchor="middle">모든 벌통은 같은 모델을 사용하며 입력 관측만 달라집니다.</text></g></svg>