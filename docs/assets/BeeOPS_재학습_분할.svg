<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="432" viewBox="0 0 1080 432" role="img" aria-label="LSTM 학습과 앙상블 결합 비중 학습 및 최종 평가의 시간순 분리"><title>LSTM 학습과 앙상블 결합 비중 학습 및 최종 평가의 시간순 분리</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#597b6b"/></marker></defs><rect width="1080" height="432" fill="white"/><g font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif"><text x="540" y="43" font-size="25" font-weight="700" fill="#29413f" text-anchor="middle">관측된 목표값을 시간순으로 나누어 사용합니다</text><path d="M55 87 L1030 87" fill="none" stroke="#597b6b" stroke-width="3" marker-end="url(#a)"/><text x="970" y="67" font-size="18" font-weight="400" fill="#29413f" text-anchor="middle">시간 순서</text><rect x="30" y="117" width="450" height="170" rx="12" fill="#edf5ed" stroke="#bfcfc4"/><text x="255.0" y="155" font-size="22" font-weight="400" fill="#29413f" text-anchor="middle">LSTM 학습 구간</text><text x="255.0" y="186" font-size="22" font-weight="400" fill="#29413f" text-anchor="middle">확인된 미래 무게만 학습</text><text x="255.0" y="217" font-size="22" font-weight="400" fill="#29413f" text-anchor="middle">8회 추가 학습 · 부모 scaler 유지</text><rect x="500" y="117" width="265" height="170" rx="12" fill="#fff5dc" stroke="#bfcfc4"/><text x="632.5" y="155" font-size="21" font-weight="400" fill="#29413f" text-anchor="middle">결합 비중 학습</text><text x="632.5" y="186" font-size="21" font-weight="400" fill="#29413f" text-anchor="middle">뒤쪽 6~24개 시점</text><text x="632.5" y="217" font-size="21" font-weight="400" fill="#29413f" text-anchor="middle">1시간 MAE로 w 선택</text><rect x="785" y="117" width="265" height="170" rx="12" fill="#edf1f5" stroke="#bfcfc4"/><text x="917.5" y="155" font-size="21" font-weight="400" fill="#29413f" text-anchor="middle">최종 성능 확인</text><text x="917.5" y="186" font-size="21" font-weight="400" fill="#29413f" text-anchor="middle">마지막 6~24개 시점</text><text x="917.5" y="217" font-size="21" font-weight="400" fill="#29413f" text-anchor="middle">비중 선택에는 미사용</text><text x="540" y="335" font-size="21" font-weight="400" fill="#29413f" text-anchor="middle">각 예측은 목표 시각 이전의 실제 관측만 입력으로 사용합니다.</text><text x="540" y="375" font-size="19" font-weight="400" fill="#29413f" text-anchor="middle">이 분리는 이번 추가 학습의 목표값에 대한 분리입니다.</text><text x="540" y="403" font-size="19" font-weight="400" fill="#29413f" text-anchor="middle">부모 모델의 과거 학습 자료까지 새 미사용 평가 자료로 바꾸지는 않습니다.</text></g></svg>