<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="595" viewBox="0 0 1080 595" role="img" aria-label="BeeOPS 관측 입력 예측 제공 온도 변화 감지 앙상블 재학습 흐름"><title>BeeOPS 관측 입력 예측 제공 온도 변화 감지 앙상블 재학습 흐름</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#597b6b"/></marker></defs><rect width="1080" height="595" fill="white"/><g font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif"><text x="540" y="44" font-size="26" font-weight="700" fill="#29413f" text-anchor="middle">관측 업로드에서 예측과 모델 운영까지</text><rect x="20" y="86" width="230" height="125" rx="12" fill="#f5f8f2" stroke="#bfcfc4"/><text x="135.0" y="124" font-size="20" font-weight="400" fill="#29413f" text-anchor="middle">CSV 업로드</text><text x="135.0" y="155" font-size="20" font-weight="400" fill="#29413f" text-anchor="middle">미리보기·신규 행 확인</text><rect x="290" y="86" width="230" height="125" rx="12" fill="#f5f8f2" stroke="#bfcfc4"/><text x="405.0" y="124" font-size="20" font-weight="400" fill="#29413f" text-anchor="middle">입력 검증과 저장</text><text x="405.0" y="155" font-size="20" font-weight="400" fill="#29413f" text-anchor="middle">벌통별 관측 원장</text><rect x="560" y="86" width="230" height="125" rx="12" fill="#f5f8f2" stroke="#bfcfc4"/><text x="675.0" y="124" font-size="20" font-weight="400" fill="#29413f" text-anchor="middle">공통 앙상블 예측</text><text x="675.0" y="155" font-size="20" font-weight="400" fill="#29413f" text-anchor="middle">최근 168시간 입력</text><rect x="830" y="86" width="230" height="125" rx="12" fill="#f5f8f2" stroke="#bfcfc4"/><text x="945.0" y="124" font-size="20" font-weight="400" fill="#29413f" text-anchor="middle">운영 판단 지원</text><text x="945.0" y="155" font-size="20" font-weight="400" fill="#29413f" text-anchor="middle">7일 예측·채밀 추천</text><path d="M250 146 L284 146" fill="none" stroke="#597b6b" stroke-width="3" marker-end="url(#a)"/><path d="M520 146 L554 146" fill="none" stroke="#597b6b" stroke-width="3" marker-end="url(#a)"/><path d=